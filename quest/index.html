<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPO QUEST — Flevoland &amp; Utrecht</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1923;--card:#1a2a3a;--card2:#0d2035;
  --red:#e8192c;--blue:#0055a4;--yellow:#ffb800;--green:#00a550;
  --border:#2a3a5a;--text:#e8eaf0;--text-dim:#7a8ab0;
  --shadow:0 4px 0 rgba(0,0,0,0.5);
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:16px;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Nunito',sans-serif;font-weight:900}

.screen{display:none;min-height:100vh;padding:16px;flex-direction:column}
.screen.active{display:flex}

/* Buttons */
.btn{
  font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;
  padding:11px 24px;border:none;border-radius:8px;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;
  transition:transform .1s,box-shadow .1s;
  box-shadow:var(--shadow);position:relative;top:0;
}
.btn:active{top:3px;box-shadow:0 1px 0 rgba(0,0,0,0.5)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#c8141f}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#004080}
.btn-yellow{background:var(--yellow);color:#1a1a1a}
.btn-yellow:hover{background:#d99e00}
.btn-sm{font-size:12px;padding:8px 16px}
.btn:disabled{opacity:.4;cursor:not-allowed;top:0}

input,select{
  background:var(--card2);border:2px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;
  padding:10px 14px;outline:none;width:100%;transition:border .2s;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,164,.2)}
label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--text-dim);display:block;margin-bottom:5px;text-transform:uppercase}
.field{margin-bottom:14px}

#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:10px 22px;border-radius:8px;font-weight:700;font-size:13px;
  z-index:10000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1}
#toast.err{border-color:var(--red);color:var(--red)}

/* ===== START SCREEN ===== */
#screen-start{align-items:center;justify-content:center;gap:20px;text-align:center}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-emoji{font-size:80px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.logo-title{
  font-size:clamp(28px,7vw,68px);font-weight:900;
  color:var(--red);letter-spacing:3px;
  text-shadow:3px 3px 0 rgba(0,0,0,.3),0 0 40px rgba(232,25,44,.3);
}
.logo-sub{font-size:14px;font-weight:700;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase;margin-top:-8px}
.start-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px;box-shadow:var(--shadow);width:100%;max-width:400px;
}
.start-info{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:14px}
.start-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ===== GAME SCREEN ===== */
#screen-game{
  gap:8px;max-width:1400px;width:100%;margin:0 auto;
  height:100vh;box-sizing:border-box;overflow:hidden;
}
.game-hdr{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  background:var(--card);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);
}
.score-lbl{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.score-val{font-size:22px;font-weight:900;color:var(--yellow)}
.lives{display:flex;gap:3px}
.life{font-size:22px;transition:.3s}
.life.lost{opacity:.2;filter:grayscale(1)}
.timer-wrap{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:110px;text-align:center}
.timer-sec{font-size:30px;font-weight:900;color:var(--blue);line-height:1}
.timer-sec.urg{color:var(--red);animation:urg-pulse .5s infinite alternate}
@keyframes urg-pulse{from{opacity:1}to{opacity:.5}}
.timer-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.timer-bar{height:100%;background:var(--blue);border-radius:4px;transition:width 1s linear,background .5s}
.timer-bar.urg{background:var(--red)}
.prog-lbl{font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
.agent-badge{font-size:12px;font-weight:700;color:var(--text-dim)}

.mission-panel{
  background:var(--card);border-radius:10px;border-left:5px solid var(--yellow);
  padding:11px 16px;box-shadow:var(--shadow);flex-shrink:0;
}
.mission-lbl{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--yellow);text-transform:uppercase;margin-bottom:4px}
.mission-txt{font-size:clamp(14px,2vw,17px);font-weight:700;line-height:1.4}
.mission-txt .loc-name{
  background:var(--red);color:#fff;padding:2px 10px;border-radius:6px;
  font-weight:900;font-size:.95em;display:inline-block;
}

.hints-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:34px;flex-shrink:0}
.hint-box{
  background:rgba(255,184,0,.08);border:2px solid var(--yellow);border-radius:8px;
  padding:5px 12px;font-size:13px;font-weight:700;color:#c8980a;
  flex:1;min-width:180px;display:none;
}

/* Map */
.map-wrap{
  position:relative;width:100%;flex:1;min-height:0;
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
  border:2px solid var(--border);background:#5a8ab0;
}
.map-svg{width:100%;height:100%;display:block}
.map-overlay{position:absolute;inset:0;pointer-events:none}

/* Markers */
.marker{
  position:absolute;width:18px;height:18px;border-radius:50%;
  background:var(--red);border:3px solid #fff;
  cursor:pointer;transform:translate(-50%,-50%);z-index:3;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s;
  pointer-events:all;
}
.marker:hover{transform:translate(-50%,-50%) scale(1.5)}
.marker.hint-pulse{animation:mhint .7s infinite !important;transition:none !important;z-index:10}
@keyframes mhint{
  0%,100%{box-shadow:0 0 0 0 rgba(255,184,0,.5);transform:translate(-50%,-50%) scale(1.3)}
  50%{box-shadow:0 0 0 14px rgba(255,184,0,0);transform:translate(-50%,-50%) scale(1.8)}
}
.marker.correct{background:var(--green);animation:mcorrect .5s forwards;pointer-events:none}
@keyframes mcorrect{
  0%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(2.5);box-shadow:0 0 20px var(--green)}
  100%{transform:translate(-50%,-50%) scale(1.3)}
}
.marker.wrong{background:var(--red);animation:mshake .4s;pointer-events:none;box-shadow:0 0 16px var(--red)}
@keyframes mshake{
  0%,100%{transform:translate(-50%,-50%)}
  25%{transform:translate(calc(-50% - 8px),-50%)}
  75%{transform:translate(calc(-50% + 8px),-50%)}
}

/* Roblox character */
#roblox-char{
  position:absolute;z-index:15;transform:translate(-50%,-50%);
  pointer-events:none;
  transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1);
  display:none;
}
.char-inner{display:flex;flex-direction:column;align-items:center;gap:1px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.char-head{width:22px;height:22px;background:var(--yellow);border:2.5px solid #222;border-radius:3px}
.char-body{width:26px;height:16px;background:var(--blue);border:2.5px solid #222;border-radius:3px}
#roblox-char.anim-ok{animation:char-ok .9s ease-in-out}
#roblox-char.anim-fail{animation:char-fail .6s ease-in-out}
@keyframes char-ok{
  0%{transform:translate(-50%,-50%) scale(1)}
  25%{transform:translate(-50%,-80%) scale(1.4) rotate(-12deg)}
  50%{transform:translate(-50%,-50%) scale(1.6)}
  75%{transform:translate(-50%,-72%) scale(1.3) rotate(12deg)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
@keyframes char-fail{
  0%,100%{transform:translate(-50%,-50%)}
  25%{transform:translate(calc(-50% - 9px),-50%) rotate(-10deg)}
  75%{transform:translate(calc(-50% + 9px),-50%) rotate(10deg)}
}

/* Feedback */
.feedback{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(22px,5vw,44px);font-weight:900;
  text-align:center;z-index:20;pointer-events:none;display:none;
  text-shadow:0 3px 0 rgba(0,0,0,.3);
}
.feedback.show{display:block;animation:fb-anim 1.3s forwards}
.fb-ok{color:var(--green)}.fb-fail{color:var(--red)}
@keyframes fb-anim{
  0%{opacity:0;transform:translate(-50%,-65%) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-40%) scale(1.15)}
}

/* ===== RESULT SCREEN ===== */
#screen-result{align-items:center;justify-content:center;gap:18px;text-align:center}
.res-icon{font-size:72px}
.res-title{font-size:clamp(18px,4vw,34px);font-weight:900;letter-spacing:2px}
.res-score{font-size:clamp(56px,13vw,110px);font-weight:900;color:var(--yellow);line-height:1;text-shadow:0 0 40px rgba(255,184,0,.4)}
.res-stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.res-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 22px;text-align:center;min-width:100px;box-shadow:var(--shadow)}
.res-stat-val{font-size:26px;font-weight:900;color:var(--blue)}
.res-stat-lbl{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#rank-info{font-size:15px;font-weight:700;color:var(--text-dim)}

/* ===== TOP 10 SCREEN ===== */
#screen-top10{align-items:center;gap:18px}
.t10-list{width:100%;max-width:560px}
.t10-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border-radius:10px;margin-bottom:8px;
  padding:12px 14px;box-shadow:0 2px 0 rgba(0,0,0,.3);
}
.t10-row.hl{border:2px solid var(--yellow);background:rgba(255,184,0,.06)}
.t10-rank{font-size:18px;font-weight:900;width:30px;text-align:center}
.t10-name{flex:1;font-weight:700;font-size:15px}
.t10-ok{font-size:13px;color:var(--text-dim);font-weight:700}
.t10-pts{font-weight:900;font-size:15px;color:var(--yellow)}
.t10-date{font-size:12px;color:var(--text-dim);font-weight:600}
.t10-empty{text-align:center;padding:32px;color:var(--text-dim);font-weight:700}
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div id="screen-start" class="screen active">
  <div class="logo-wrap">
    <div class="logo-emoji">🎮</div>
    <div class="logo-title">TOPO QUEST</div>
    <div class="logo-sub">Flevoland &amp; Utrecht</div>
  </div>
  <div class="start-card">
    <div class="field">
      <label for="player-input">Jouw naam</label>
      <input id="player-input" type="text" placeholder="Voer je naam in..." maxlength="20" autocomplete="off"
        onkeydown="if(event.key==='Enter')startGame()">
    </div>
    <div class="start-info">
      <span id="loc-count">0</span> steden &nbsp;·&nbsp; <span id="timer-info">15</span> sec per ronde
    </div>
    <div class="start-btns">
      <button class="btn btn-red" onclick="startGame()">🎮 SPEEL!</button>
      <button class="btn btn-blue btn-sm" onclick="showScreen('screen-top10');loadTop10()">🏆 Top 10</button>
    </div>
  </div>
  <div id="admin-hotspot" style="position:fixed;bottom:0;right:0;width:40px;height:40px;opacity:0;cursor:pointer" onclick="showAdminPrompt()"></div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="screen-game" class="screen">
  <div class="game-hdr">
    <div>
      <div class="score-lbl">Score</div>
      <div class="score-val" id="g-score">0</div>
    </div>
    <div class="lives" id="g-lives"></div>
    <div class="timer-wrap">
      <div class="timer-sec" id="t-sec">15</div>
      <div class="timer-track"><div class="timer-bar" id="t-bar" style="width:100%"></div></div>
    </div>
    <div style="text-align:right">
      <div class="score-lbl">Missie</div>
      <div class="prog-lbl" id="g-prog">— / —</div>
    </div>
    <div class="agent-badge" id="g-agent"></div>
  </div>

  <div class="mission-panel">
    <div class="mission-lbl">🎯 Missie</div>
    <div class="mission-txt" id="g-mission">—</div>
  </div>

  <div class="hints-row">
    <div class="hint-box" id="hint1"></div>
    <div class="hint-box" id="hint2"></div>
    <button class="btn btn-yellow btn-sm" id="hint-btn" onclick="useHint()" style="flex-shrink:0">💡 Hint (-50 pts)</button>
  </div>

  <div class="map-wrap" id="map-wrap">
    <!-- SVG Map: Flevoland & Utrecht region -->
    <svg id="map-svg" viewBox="0 0 800 900" preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">

      <!-- Water background -->
      <rect width="800" height="900" fill="#7aafc8"/>

      <!-- NW corner land (Noord-Holland hints) -->
      <polygon points="0,0 195,0 175,85 100,175 0,220" fill="#c8c8b8" stroke="#9a9a8a" stroke-width="1.5"/>

      <!-- NE corner land -->
      <polygon points="710,0 800,0 800,140 740,110" fill="#c8c8b8" stroke="#9a9a8a" stroke-width="1.5"/>

      <!-- Noordoostpolder (Emmeloord) -->
      <polygon points="385,10 655,8 725,52 728,208 658,252 525,264 418,228 383,166 372,85"
               fill="#b8d8b0" stroke="#7a9a7a" stroke-width="2"/>

      <!-- Main Flevoland polder (Lelystad + Almere) -->
      <polygon points="195,148 432,90 568,142 582,290 518,398 405,474 292,488 182,394 192,265"
               fill="#c0dab8" stroke="#7a9a7a" stroke-width="2"/>

      <!-- Oostvaardersplassen (nature reserve) -->
      <polygon points="262,190 348,172 378,236 316,280 252,272"
               fill="#8ab88a" stroke="#5a885a" stroke-width="1.2" opacity="0.9"/>

      <!-- Right-side land (Gelderland/Overijssel edge) -->
      <polygon points="728,208 800,178 800,900 668,900 608,758 642,588 688,438 730,312"
               fill="#c8c8b8" stroke="#9a9a8a" stroke-width="1.5"/>

      <!-- Utrecht province -->
      <polygon points="72,492 498,460 562,528 542,690 432,770 168,778 42,728 48,600"
               fill="#e8e2b8" stroke="#a89850" stroke-width="2"/>

      <!-- Bottom land -->
      <polygon points="0,778 800,792 800,900 0,900" fill="#c8c8b8" stroke="#9a9a8a" stroke-width="1.5"/>

      <!-- Left land strip -->
      <polygon points="0,220 98,175 138,345 108,485 0,530" fill="#c8c8b8" stroke="#9a9a8a" stroke-width="1.5"/>

      <!-- Randmeren (thin water between Flevoland east and mainland) -->
      <path d="M 582,290 Q 620,360 648,440 L 688,438" stroke="#6898b8" stroke-width="10" fill="none" opacity="0.7"/>

      <!-- Amsterdam-Rijnkanaal -->
      <path d="M 298,476 Q 278,565 262,672 Q 250,730 238,775" stroke="#5888a8" stroke-width="5" fill="none"/>

      <!-- Lek -->
      <path d="M 42,728 Q 158,745 258,734 Q 338,726 405,734" stroke="#5888a8" stroke-width="5" fill="none"/>

      <!-- Neder-Rijn -->
      <path d="M 378,736 Q 482,720 582,726 Q 635,730 695,720" stroke="#5888a8" stroke-width="5" fill="none"/>

      <!-- Province labels -->
      <text x="492" y="168" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#3a5a3a" opacity="0.75">FLEVOLAND</text>
      <text x="172" y="628" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#6a5a1a" opacity="0.75">UTRECHT</text>

      <!-- Feature labels -->
      <text x="265" y="225" font-family="Georgia,serif" font-size="11" fill="#2a5a2a" font-style="italic" opacity="0.9">Oostvaardersplassen</text>
      <text x="148" y="752" font-family="Georgia,serif" font-size="10" fill="#2a5878" opacity="0.9">Amsterdam-Rijnkanaal</text>
      <text x="50" y="750" font-family="Georgia,serif" font-size="10" fill="#2a5878" opacity="0.9">Lek</text>
      <text x="465" y="745" font-family="Georgia,serif" font-size="10" fill="#2a5878" opacity="0.9">Neder-Rijn</text>
    </svg>

    <!-- Clickable marker overlay -->
    <div class="map-overlay" id="map-overlay"></div>

    <!-- Roblox character -->
    <div id="roblox-char">
      <div class="char-inner">
        <div class="char-head"></div>
        <div class="char-body"></div>
      </div>
    </div>

    <!-- Feedback text -->
    <div class="feedback fb-ok" id="fb-ok">NICE! 🎉</div>
    <div class="feedback fb-fail" id="fb-fail">FOUT! 💀</div>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result" class="screen">
  <div class="res-icon" id="res-icon">🏆</div>
  <div class="res-title" id="res-title">GAME OVER</div>
  <div class="res-score" id="res-score">0</div>
  <div class="res-stats">
    <div class="res-stat"><div class="res-stat-val" id="res-ok">0</div><div class="res-stat-lbl">Goed</div></div>
    <div class="res-stat"><div class="res-stat-val" id="res-fail">0</div><div class="res-stat-lbl">Fout</div></div>
    <div class="res-stat"><div class="res-stat-val" id="res-hints">0</div><div class="res-stat-lbl">Hints</div></div>
  </div>
  <div id="rank-info"></div>
  <div class="res-btns">
    <button class="btn btn-red" onclick="startGame()">🔄 Opnieuw</button>
    <button class="btn btn-blue" onclick="showScreen('screen-top10');loadTop10()">🏆 Top 10</button>
    <button class="btn btn-yellow btn-sm" onclick="showScreen('screen-start')">🏠 Menu</button>
  </div>
</div>

<!-- ===== TOP 10 SCREEN ===== -->
<div id="screen-top10" class="screen">
  <h2 style="font-size:clamp(20px,4vw,34px)">🏆 Top 10 Spelers</h2>
  <div class="t10-list" id="t10-list"><div class="t10-empty">Laden...</div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-red btn-sm" onclick="showScreen('screen-start')">🏠 Menu</button>
    <button class="btn btn-yellow btn-sm" onclick="startGame()">🎮 Speel</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== LOCATION DATA =====
// x/y are percentages of the map container (matching SVG viewBox proportions)
const DEFAULTS = [
  {
    id:'l1', name:'Emmeloord', x:62, y:14,
    mt:'🎮 Een Roblox-speler is gesignaleerd in <span class="loc-name">Emmeloord</span>! Wijs de stad aan!',
    hints:['Deze stad ligt in de Noordoostpolder.','Emmeloord is de enige echte stad van de Noordoostpolder.']
  },
  {
    id:'l2', name:'Lelystad', x:41, y:28,
    mt:'🏗️ Bouwplaats ontdekt in <span class="loc-name">Lelystad</span>! Tik de stad aan op de kaart!',
    hints:['Dit is de hoofdstad van de provincie Flevoland.','Lelystad ligt aan het Markermeer.']
  },
  {
    id:'l3', name:'Almere', x:36, y:48,
    mt:'💎 Robux-schat verstopt in <span class="loc-name">Almere</span>! Wijs de stad snel aan!',
    hints:['Dit is de grootste stad van Flevoland.','Almere grenst aan Amsterdam via het IJmeer.']
  },
  {
    id:'l4', name:'Amersfoort', x:50, y:65,
    mt:'⚔️ Gevecht uitgebroken op server in <span class="loc-name">Amersfoort</span>! Vind de stad!',
    hints:['Deze stad ligt in de provincie Utrecht.','Amersfoort is beroemd om zijn historische Koppelpoort.']
  },
  {
    id:'l5', name:'Utrecht', x:28, y:76,
    mt:'🚀 Spawn point gevonden in <span class="loc-name">Utrecht</span>! Wijs de stad aan!',
    hints:['Dit is de hoofdstad van de provincie Utrecht.','Utrecht heeft de beroemde Domtoren — de hoogste kerktoren van Nederland.']
  },
];

// ===== CONFIG & STATE =====
const SK = 'topo_quest_cfg', QK = 'topo_quest_scores';

function loadCfg() {
  try { const s = JSON.parse(localStorage.getItem(SK)); if (s && s.timerSeconds) return s; } catch(e) {}
  return { timerSeconds: 15, adminPassword: 'quest123', locations: DEFAULTS.map(d => ({...d})) };
}
let cfg = loadCfg();
let gs = {};

function resetGs() {
  gs = { name:'', queue:[], idx:0, score:0, ok:0, fail:0, hints:0, lives:3,
         timer:null, timeLeft:0, answered:false, hintTimer:null, hintShown:0, questionStart:0 };
}

// ===== SCREENS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== TOAST =====
let toastTimer;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2500);
}

// ===== INIT START =====
function initStart() {
  const n = cfg.locations.filter(l => l.x !== null).length;
  document.getElementById('loc-count').textContent = n;
  document.getElementById('timer-info').textContent = cfg.timerSeconds;
}

// ===== START GAME =====
function startGame() {
  const input = document.getElementById('player-input');
  const name = (input && input.value.trim()) || gs.name || 'Speler';

  resetGs();
  gs.name = name;

  const locs = cfg.locations.filter(l => l.x !== null);
  gs.queue = shuffle([...locs]);

  document.getElementById('g-agent').textContent = '👤 ' + gs.name;
  updateLives();
  updateScore();

  showScreen('screen-game');
  buildMarkers();
  initChar();
  nextQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== CHARACTER =====
function initChar() {
  const ch = document.getElementById('roblox-char');
  ch.style.left = '50%';
  ch.style.top = '30%';
  ch.style.display = 'block';
  ch.className = '';
}

function moveChar(x, y) {
  const ch = document.getElementById('roblox-char');
  ch.style.left = x + '%';
  ch.style.top = y + '%';
}

function animChar(type) {
  const ch = document.getElementById('roblox-char');
  ch.classList.remove('anim-ok', 'anim-fail');
  void ch.offsetWidth;
  ch.classList.add(type === 'ok' ? 'anim-ok' : 'anim-fail');
  setTimeout(() => ch.classList.remove('anim-ok', 'anim-fail'), 950);
}

// ===== MARKERS =====
let markerEls = {};

function buildMarkers() {
  const overlay = document.getElementById('map-overlay');
  overlay.innerHTML = '';
  markerEls = {};

  cfg.locations.filter(l => l.x !== null).forEach(loc => {
    const m = document.createElement('div');
    m.className = 'marker';
    m.style.left = loc.x + '%';
    m.style.top = loc.y + '%';
    m.dataset.id = loc.id;
    m.addEventListener('click', () => onMarkerClick(loc.id));
    overlay.appendChild(m);
    markerEls[loc.id] = m;
  });
}

// ===== GAME LOOP =====
function nextQuestion() {
  document.getElementById('hint1').style.display = 'none';
  document.getElementById('hint2').style.display = 'none';
  document.getElementById('hint-btn').disabled = false;
  clearTimeout(gs.hintTimer);
  gs.hintShown = 0;
  gs.answered = false;

  Object.values(markerEls).forEach(m => m.className = 'marker');

  if (gs.idx >= gs.queue.length || gs.lives <= 0) {
    endGame();
    return;
  }

  const loc = gs.queue[gs.idx];
  document.getElementById('g-mission').innerHTML = loc.mt;
  document.getElementById('g-prog').textContent = (gs.idx + 1) + ' / ' + gs.queue.length;
  gs.questionStart = Date.now();

  if (loc.hints && loc.hints.length) {
    gs.hintTimer = setTimeout(() => showAutoHint(loc), 5000);
  }

  startRoundTimer();
}

function showAutoHint(loc) {
  if (gs.answered || gs.hintShown >= 2) return;
  const el = document.getElementById('hint' + (gs.hintShown + 1));
  if (el && loc.hints[gs.hintShown]) {
    el.textContent = '💡 ' + loc.hints[gs.hintShown];
    el.style.display = 'block';
    const m = markerEls[loc.id];
    if (m) { m.classList.add('hint-pulse'); setTimeout(() => m.classList.remove('hint-pulse'), 2000); }
    gs.hintShown++;
    if (gs.hintShown < 2) gs.hintTimer = setTimeout(() => showAutoHint(loc), 6000);
  }
}

function useHint() {
  if (gs.answered) return;
  const loc = gs.queue[gs.idx];
  clearTimeout(gs.hintTimer);
  showAutoHint(loc);
  gs.score = Math.max(0, gs.score - 50);
  gs.hints++;
  updateScore();
  if (gs.hintShown >= 2) document.getElementById('hint-btn').disabled = true;
}

function onMarkerClick(id) {
  if (gs.answered) return;
  const loc = gs.queue[gs.idx];
  const m = markerEls[id];
  const elapsed = (Date.now() - gs.questionStart) / 1000;

  if (id === loc.id) {
    gs.answered = true;
    clearInterval(gs.timer);
    clearTimeout(gs.hintTimer);

    const pts = 100 + Math.max(0, Math.round((cfg.timerSeconds - elapsed) * 6));
    gs.score += pts;
    gs.ok++;
    updateScore();

    moveChar(loc.x, loc.y);
    setTimeout(() => {
      m.classList.add('correct');
      animChar('ok');
      playSound('ok');
      showFeedback('ok', 'NICE! +' + pts + ' 🎉');
      setTimeout(() => { gs.idx++; nextQuestion(); }, 1000);
    }, 560);
  } else {
    gs.fail++;
    m.classList.add('wrong');
    animChar('fail');
    playSound('fail');
    showFeedback('fail', 'FOUT! 💀');
    setTimeout(() => m.className = 'marker', 500);
  }
}

function showFeedback(type, msg) {
  const el = document.getElementById(type === 'ok' ? 'fb-ok' : 'fb-fail');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1300);
}

function updateLives() {
  const el = document.getElementById('g-lives');
  el.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('span');
    s.className = 'life' + (i >= gs.lives ? ' lost' : '');
    s.textContent = '💎';
    el.appendChild(s);
  }
}

function updateScore() {
  document.getElementById('g-score').textContent = gs.score;
}

// ===== TIMER =====
function startRoundTimer() {
  clearInterval(gs.timer);
  gs.timeLeft = cfg.timerSeconds;
  setTimerUI(gs.timeLeft, cfg.timerSeconds);
  gs.timer = setInterval(() => {
    gs.timeLeft--;
    setTimerUI(gs.timeLeft, cfg.timerSeconds);
    if (gs.timeLeft <= 0) { clearInterval(gs.timer); endGame(); }
  }, 1000);
}

function setTimerUI(t, max) {
  const sec = document.getElementById('t-sec');
  const bar = document.getElementById('t-bar');
  sec.textContent = t;
  const urg = t <= 5;
  sec.className = 'timer-sec' + (urg ? ' urg' : '');
  bar.style.width = (t / max * 100) + '%';
  bar.className = 'timer-bar' + (urg ? ' urg' : '');
}

// ===== END GAME =====
function endGame() {
  clearInterval(gs.timer);
  clearTimeout(gs.hintTimer);

  const pct = gs.ok / Math.max(1, gs.queue.length);
  const icon = pct >= 0.8 ? '🏆' : pct >= 0.5 ? '🎮' : '💀';
  const title = pct >= 0.8 ? 'GEWELDIG! EZ CLAP!' : pct >= 0.5 ? 'GOED GESPEELD!' : 'GAME OVER';

  document.getElementById('res-icon').textContent = icon;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-score').textContent = gs.score;
  document.getElementById('res-ok').textContent = gs.ok;
  document.getElementById('res-fail').textContent = gs.fail;
  document.getElementById('res-hints').textContent = gs.hints;
  document.getElementById('rank-info').textContent = '';

  showScreen('screen-result');
  if (gs.score > 0) saveScore(gs.name, gs.score, gs.ok);
}

// ===== SCORES =====
function saveScore(name, score, ok) {
  try {
    let arr = JSON.parse(localStorage.getItem(QK)) || [];
    arr.push({ name, score, ok: ok || 0, date: new Date().toLocaleDateString('nl-NL') });
    arr.sort((a, b) => b.score - a.score);
    arr = arr.slice(0, 10);
    localStorage.setItem(QK, JSON.stringify(arr));
    const rank = arr.findIndex(s => s.score === score) + 1;
    if (rank) document.getElementById('rank-info').textContent = '🏅 Jij staat op plek #' + rank + '!';
  } catch(e) {}
}

function loadTop10() {
  const list = document.getElementById('t10-list');
  try {
    const arr = JSON.parse(localStorage.getItem(QK)) || [];
    renderTop10(arr, list);
  } catch(e) {
    list.innerHTML = '<div class="t10-empty">Kan scorebord niet laden.</div>';
  }
}

function renderTop10(arr, list) {
  if (!list) list = document.getElementById('t10-list');
  const medals = ['🥇','🥈','🥉'];
  if (!arr.length) { list.innerHTML = '<div class="t10-empty">Nog geen scores. Speel het spel! 🎮</div>'; return; }
  list.innerHTML = arr.map((s, i) => `
    <div class="t10-row ${s.name === gs.name && s.score === gs.score ? 'hl' : ''}">
      <div class="t10-rank">${i < 3 ? medals[i] : i + 1}</div>
      <div class="t10-name">${esc(s.name)}</div>
      <div class="t10-ok">${s.ok || 0} goed</div>
      <div class="t10-pts">${s.score} pts</div>
      <div class="t10-date">${s.date || ''}</div>
    </div>`).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== SOUNDS =====
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'ok') {
      [[523,0],[659,.1],[784,.2],[1047,.32]].forEach(([freq, delay]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, ctx.currentTime + delay);
        g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + delay + 0.02);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + delay + 0.22);
        o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.25);
      });
    } else {
      [[220,0],[196,.12]].forEach(([freq, delay]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.15, ctx.currentTime + delay);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + delay + 0.2);
        o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.22);
      });
    }
  } catch(e) {}
}

// ===== ADMIN =====
function showAdminPrompt() {
  const pw = prompt('Admin wachtwoord:');
  if (pw === cfg.adminPassword) {
    const sec = prompt('Timer seconden (huidig: ' + cfg.timerSeconds + '):');
    if (sec && !isNaN(+sec) && +sec >= 5 && +sec <= 120) {
      cfg.timerSeconds = +sec;
      localStorage.setItem(SK, JSON.stringify(cfg));
      initStart();
      toast('Timer ingesteld op ' + sec + 's');
    }
  } else if (pw !== null) {
    toast('Verkeerd wachtwoord', true);
  }
}

// ===== BOOT =====
initStart();
</script>
